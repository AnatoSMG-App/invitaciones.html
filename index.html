<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anato S.M.G. VIP</title>
    <style>
        :root { --frio: #00f2ff; --calor: #ff4500; --riesgo: #ff3131; }
        body, html { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow-x: hidden; color: white; height: 100%; width: 100%; }
        
        .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; background: #000; }
        .active { display: flex; }

        /* PANTALLA INICIAL - LOGO MANTENIDO */
        #pantalla-play { z-index: 5000; }
        #escudo-main { 
            width: 85%; 
            max-width: 500px; 
            margin-bottom: 30px; 
            animation: latido 2s infinite; 
            filter: drop-shadow(0 0 15px var(--frio));
        }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #btn-iniciar { 
            background: var(--frio); color: #000; padding: 18px 40px; 
            border-radius: 50px; border: none; font-weight: bold; font-size: 1.2rem; 
            cursor: pointer; box-shadow: 0 0 20px var(--frio);
            text-transform: uppercase;
        }

        .layer > img { max-width: 85% !important; max-height: 50vh !important; object-fit: contain !important; margin: 20px auto; }

        #fase-cuarto { z-index: 1000; }
        #img-cuarto { width: 90%; height: auto; border: 2px solid var(--frio); border-radius: 10px; }

        /* FASE: PANEL FINAL (SIN BLOQUE DE PRESUPUESTO) */
        #fase-panel { z-index: 500; overflow-y: auto; display: none; padding-top: 20px; }
        #fase-panel.active { display: block; }
        
        .split { display: flex; flex-wrap: wrap; width: 100%; min-height: 60vh; }
        .panel { flex: 1; min-width: 300px; padding: 15px; border: 1px solid #222; }
        .temp { font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; }
        
        .item { display: flex; align-items: center; margin-bottom: 15px; opacity: 0; transform: scale(0.8); transition: 0.5s; font-size: 0.9rem; text-align: left; }
        .item.show { opacity: 1; transform: scale(1); }
        .item img { width: 35px; height: 35px; border-radius: 5px; margin-right: 10px; border: 1px solid var(--frio); }

        #pop-img { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 80%; max-width: 400px; z-index: 2000; border: 4px solid var(--frio); border-radius: 20px; transition: 0.3s; background: #000; }
        
        /* FOOTER SIMÉTRICO ESTANDARIZADO */
        .footer { width: 100%; padding: 20px; display: flex; gap: 15px; background: #000; position: relative; box-sizing: border-box; justify-content: center; }
        
        .btn-base { 
            flex: 1; height: 75px; border-radius: 12px; border: none; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; position: relative; overflow: hidden;
            text-decoration: none;
        }

        /* BOTÓN FRÍO (IZQUIERDA) */
        .btn-frio { 
            background: #001a1d; color: var(--frio); border: 2px solid var(--frio);
            box-shadow: 0 0 10px var(--frio);
            animation: palpitacionFrio 2s infinite ease-in-out;
        }
        @keyframes palpitacionFrio { 
            0%, 100% { filter: brightness(1); box-shadow: 0 0 5px var(--frio); } 
            50% { filter: brightness(1.4); box-shadow: 0 0 25px var(--frio); } 
        }

        /* BOTÓN CALOR (DERECHA) */
        .btn-calor { 
            background: #1a0800; color: #ff9100; border: 2px solid var(--calor);
            box-shadow: 0 0 10px rgba(255, 69, 0, 0.4);
            animation: espejismoCalor 1.5s infinite alternate;
        }
        @keyframes espejismoCalor {
            0% { transform: skewX(0deg); filter: blur(0px); opacity: 1; }
            50% { transform: skewX(1.5deg); filter: blur(0.5px); opacity: 0.8; }
            100% { transform: skewX(-1.5deg); }
        }

        .btn-base:active { transform: scale(0.95); }
        @keyframes titilar { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="snd-cuarto" src="audio_vip.mp3" preload="auto"></audio>
    <audio id="snd-ok" src="aceptacion.mp3" preload="auto"></audio>

    <div id="pantalla-play" class="layer active">
        <img src="logo.png" id="escudo-main" alt="Logo">
        <button id="btn-iniciar" onclick="arrancarTodo()">INICIAR PRESENTACIÓN</button>
    </div>

    <div id="fase-cuarto" class="layer">
        <img src="comparativa.jpg" id="img-cuarto">
    </div>

    <div id="fase-panel" class="layer">
        <h2 style="color:var(--frio); margin: 20px 0;">MULTISERVICIOS ANATO S.M.G.</h2>
        
        <div class="split">
            <div class="panel">
                <div class="temp" style="color:var(--frio)">16°C ❄️</div>
                <h3 style="color: var(--frio); margin-bottom: 20px;">💎 BENEFICIOS V.I.P.</h3>
                <div id="lista-vip">
                    <div class="item" data-img="chequeo.jpg">Tecnología y Vanguardia</div>
                    <div class="item" data-img="emergencia.jpg">Atención 24/7</div>
                    <div class="item" data-img="logistica.jpg">Logística y Transporte</div>
                    <div class="item" data-img="mantenimiento.png">Mantenimiento Preventivo</div>
                    <div class="item" data-img="candado.jpg">Tarifa VIP Protegida</div>
                    <div class="item" data-img="informe.jpg">Informe Digital</div>
                </div>
           <script>
    // CAPTURA DE DATOS PARA EL PUENTE (Jorge Anato, etc.)
    const urlParams = new URLSearchParams(window.location.search);
    const nCli = urlParams.get('n') || "Cliente";
    const uCli = urlParams.get('u') || "Valencia";
    const pCli = urlParams.get('p') || "0";

    function arrancarTodo() {
        const audio = document.getElementById('snd-cuarto');
        const pantallaPlay = document.getElementById('pantalla-play');
        const faseCuarto = document.getElementById('fase-cuarto');
        const fasePanel = document.getElementById('fase-panel');

        // 1. Transición inmediata: Fuera logo, entra comparativa
        pantallaPlay.classList.remove('active');
        faseCuarto.classList.add('active');

        // 2. Play al Audio VIP
        audio.play().catch(e => console.log("Audio activo"));

        // --- SECUENCIA ESCALONADA PARA CELULAR ---

        // PASO A: A los 5 segundos, mostramos el Panel de Beneficios (16°C)
        setTimeout(() => {
            faseCuarto.classList.remove('active');
            fasePanel.classList.add('active');
            
            // Ocultamos la parte de Riesgos y Botones al principio para que no estorben
            document.querySelector('.panel:nth-child(2)').style.display = 'none';
            document.querySelector('.footer').style.display = 'none';
            
            ejecutarDanzaVIP(); // Empieza a mostrar los checks verdes de los beneficios
        }, 5000); 

        // PASO B: A los 12 segundos, mostramos los Riesgos (38°C)
        setTimeout(() => {
            const panelRiesgos = document.querySelector('.panel:nth-child(2)');
            if(panelRiesgos) {
                panelRiesgos.style.display = 'block';
                panelRiesgos.scrollIntoView({ behavior: 'smooth' });
            }
        }, 12000);

        // PASO C: RELOJ MAESTRO - A los 77 segundos aparecen los botones de decisión
        setTimeout(() => {
            const footer = document.querySelector('.footer');
            if(footer) {
                footer.style.display = 'flex';
                footer.scrollIntoView({ behavior: 'smooth' });
                console.log("¡Botones VIP liberados!");
            }
        }, 77000); 
    }

    // FUNCIÓN DE LOS CHECKS VERDES (La "Danza")
    async function ejecutarDanzaVIP() {
        const pop = document.getElementById('pop-img');
        const items = document.querySelectorAll('.item');
        for(let it of items) {
            let imgPath = it.getAttribute('data-img');
            if(imgPath) {
                pop.src = imgPath;
                pop.style.transform = "translate(-50%, -50%) scale(1)";
                await new Promise(r => setTimeout(r, 1200));
                pop.style.transform = "translate(-50%, -50%) scale(0)";
                it.innerHTML = `<img src="${imgPath}"> ` + it.innerHTML + " ✅";
            }
            it.classList.add('show');
            await new Promise(r => setTimeout(r, 400));
        }
    }

    // FUNCIÓN DE ACEPTAR (Manda al Excel y a bienvenidos)
    async function enviarDatosVip(decision) {
        const urlScript = "https://script.google.com/macros/s/AKfycbyl8kHQ3K1fGVM-mys1fu3GQEAMa2LOguLOa-OJx8Y8sYgLoURceNL4QwNx0fGvF1_b/exec";
        const datos = new URLSearchParams();
        datos.append('nombre', nCli);
        datos.append('decision', (decision === 'Aceptó' ? "SI VIP" : "NO VIP"));
        datos.append('precio', pCli + "$");
        datos.append('ubicacion', uCli);

        // Manda al Google Sheets
        fetch(urlScript, { method: "POST", mode: "no-cors", body: datos.toString() });

        if (decision === 'Aceptó') {
            window.location.href = "bienvenidos.html" + window.location.search;
        } else {
            ejecutarRechazo();
        }
    }

    function ejecutarRechazo() {
        new Audio('rechazo.mp3').play().catch(e => {});
        alert("Entendido, " + nCli + ". El equipo queda bajo su responsabilidad.");
        location.reload();
    }

    // Configurar el botón de Aceptar para que use nuestra función
    document.getElementById('btn-aceptar').onclick = function(e) {
        e.preventDefault();
        enviarDatosVip('Aceptó');
    };
</script>
