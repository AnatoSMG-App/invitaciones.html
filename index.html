<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anato S.M.G. VIP</title>
    <style>
        :root { --vip: #00f2ff; --riesgo: #ff3131; }
        body, html { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow: hidden; color: white; height: 100%; width: 100%; }
        
        .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; }
        .active { display: flex; }

        /* PANTALLA INICIAL - ESCUDO GRANDE */
        #pantalla-play { z-index: 5000; background: #000; }
        #escudo-main { width: 95%; max-width: 650px; margin-bottom: 20px; animation: latido 2s infinite; }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #btn-iniciar { 
            background: var(--vip); color: #000; padding: 22px 45px; 
            border-radius: 50px; border: none; font-weight: bold; font-size: 1.4rem; 
            cursor: pointer; box-shadow: 0 0 25px var(--vip);
        }
/* CONTROL SOLO PARA IMÁGENES DE LA PRESENTACIÓN */
.layer > img {
    max-width: 75% !important;   
    max-height: 45vh !important; 
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
    margin: auto;
    display: block;
}
}
        /* FASE: COMPARATIVA (EL CUARTO) */
        #fase-cuarto { background: #000; z-index: 1000; }
        #img-cuarto { width: 100%; height: 100%; object-fit: contain; }

        /* FASE: PANEL FINAL */
        #fase-panel { z-index: 500; overflow-y: auto; background: #000; }
        .split { display: flex; width: 100%; height: 70vh; }
        .panel { flex: 1; padding: 10px; border: 1px solid #222; }
        .temp { font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; }
        
        .item { display: flex; align-items: center; margin-bottom: 12px; opacity: 0; transform: scale(0.8); transition: 0.5s; font-size: 0.8rem; }
        .item.show { opacity: 1; transform: scale(1); }
        .item img { width: 25px; height: 25px; border-radius: 5px; margin-right: 8px; border: 1px solid var(--vip); }

        #pop-img { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 85%; z-index: 2000; border: 4px solid var(--vip); border-radius: 20px; transition: 0.4s; }
        
        .footer { width: 100%; padding: 15px; display: flex; gap: 10px; position: sticky; bottom: 0; background: #000; }
        .btn-v { flex: 1; padding: 18px; background: #39ff14; color: #000; border-radius: 10px; border: none; font-weight: bold; }
        .btn-r { flex: 1; padding: 18px; background: #ff3131; color: #fff; border-radius: 10px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="snd-cuarto" src="audio_VIP.mp3" preload="auto"></audio>
    <audio id="snd-ok" src="aceptacion.mp3" preload="auto"></audio>

    <div id="pantalla-play" class="layer active">
        <img src="logo.png" id="escudo-main">
        <button id="btn-iniciar" onclick="arrancarTodo()">INICIAR PRESENTACIÓN</button>
    </div>

    <div id="fase-cuarto" class="layer">
        <img src="comparativa.jpg" id="img-cuarto">
    </div>

    <div id="fase-panel" class="layer">
        <h3 style="color:var(--vip); margin: 10px 0;">MULTISERVICIOS ANATO S.M.G.</h3>
        <div class="split">
            <div class="panel">
                <div class="temp" style="color:var(--vip)">16°C ❄️</div>
<h3 style="color: var(--vip); text-align: center; margin-bottom: 30px;">💎 TUS BENEFICIOS V.I.P.</h4>
                <div id="lista-vip">
                    <div class="item" data-img="chequeo.jpg">Tecnología y Vanguardia</div>
                    <div class="item" data-img="emergencia.jpg">Atención 24/7</div>
                    <div class="item" data-img="logistica.jpg">Logística y Transporte</div>
                    <div class="item" data-img="mantenimiento.png">Mantenimiento Preventivo</div>
                    <div class="item" data-img="candado.jpg">Presupuesto Anclado</div>
                    <div class="item" data-img="informe.jpg">Informe Digital</div>
                </div>
            </div>
            <div class="panel">
                <div class="temp" style="color:var(--riesgo)">38°C 🔥</div>
<div style="color: #ff9100; font-size: 0.9rem; font-weight: bold; animation: titilar 0.8s infinite; margin-top: 15px; text-align: center; border: 1px dashed #ff9100; padding: 5px;">
    ⚠️ BAJO SU PROPIA RESPONSABILIDAD ⚠️
</div>
                <div id="lista-riesgo">
                    <div class="item" data-img="fuga.jpg">Fugas de Gas</div>
                    <div class="item" data-img="oxidado.jpg">Oxidación</div>
                    <div class="item" data-img="quemado.jpg">Cortocircuitos</div>
                    <div class="item" data-img="sucio.jpg">Suciedad</div>
                </div>
            </div>
        </div>
        <div class="footer">
            <button class="btn-v" onclick="window.location.href='bienvenidos.html'">ACEPTO SER V.I.P</button>
            <button class="btn-r" onclick="var audioR = new Audio('Rechazo.mp3'); audioR.play(); setTimeout(function(){ window.open('', '_self', ''); window.close(); }, 3500);">EN OTRO MOMENTO</button>
        </div>
    </div>

    <img id="pop-img" src="">

    <script>
        function arrancarTodo() {
            const audio = document.getElementById('snd-cuarto');
            
            // INTENTO DE REPRODUCCIÓN FORZOSA
            audio.currentTime = 0;
            audio.play().then(() => {
                // Si el audio arranca, cambiamos de fase
                document.getElementById('pantalla-play').classList.remove('active');
                document.getElementById('fase-cuarto').classList.add('active');

                // Tiempo de espera para pasar al panel (1:17 min = 77000ms)
                setTimeout(() => {
                    document.getElementById('fase-cuarto').classList.remove('active');
                    document.getElementById('fase-panel').classList.add('active');
                    ejecutarDanza();
                }, 77000); 
            }).catch(error => {
                alert("Error de Audio: Por favor, asegúrate de que el archivo rechazo.mp3 esté en la carpeta.");
                console.log(error);
            });
        }

        async function ejecutarDanza() {
            const pop = document.getElementById('pop-img');
            const items = document.querySelectorAll('.item');
            for(let it of items) {
                let imgPath = it.getAttribute('data-img');
                if(imgPath) {
                    pop.src = imgPath;
                    pop.style.transform = "translate(-50%, -50%) scale(1)";
                    await new Promise(r => setTimeout(r, 1300));
                    pop.style.transform = "translate(-50%, -50%) scale(0)";
                    it.innerHTML = `<img src="${imgPath}"> ` + it.innerHTML + " ✅";
                }
                it.classList.add('show');
                await new Promise(r => setTimeout(r, 400));
            }
        }
    </script>
</body>
</html>
