<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anato S.M.G. VIP</title>
    <style>
        :root { --frio: #00f2ff; --calor: #ff4500; --riesgo: #ff3131; }
        body, html { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow-x: hidden; color: white; height: 100%; width: 100%; }
        
        .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; background: #000; transition: opacity 0.8s ease-in-out; }
        .active { display: flex; }

        /* PANTALLA INICIAL - LOGO MANTENIDO */
        #pantalla-play { z-index: 5000; }
        #escudo-main { 
            width: 85%; 
            max-width: 500px; 
            margin-bottom: 30px; 
            animation: latido 2s infinite; 
            filter: drop-shadow(0 0 15px var(--frio));
        }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #btn-iniciar { 
            background: var(--frio); color: #000; padding: 18px 40px; 
            border-radius: 50px; border: none; font-weight: bold; font-size: 1.2rem; 
            cursor: pointer; box-shadow: 0 0 20px var(--frio);
            text-transform: uppercase;
        }

        .layer > img { max-width: 85% !important; max-height: 50vh !important; object-fit: contain !important; margin: 20px auto; }

        #fase-cuarto { z-index: 1000; }
        #img-cuarto { width: 90%; height: auto; border: 2px solid var(--frio); border-radius: 10px; }

        /* FASE: PANEL FINAL AJUSTADO PARA SECUENCIA */
        #fase-panel { z-index: 500; overflow-y: auto; display: none; padding-top: 20px; }
        #fase-panel.active { display: block; }
        
        .panel-container { width: 100%; transition: opacity 0.8s ease-in-out; }
        .temp { font-size: 2.2rem; font-weight: bold; margin-bottom: 15px; }
        
        .item { display: flex; align-items: center; justify-content: center; margin-bottom: 15px; opacity: 0; transform: scale(0.8); transition: 0.5s; font-size: 1.1rem; text-align: left; width: 80%; margin-left: 10%; }
        .item.show { opacity: 1; transform: scale(1); }
        .item img { width: 45px; height: 45px; border-radius: 8px; margin-right: 15px; border: 1px solid var(--frio); }

        #pop-img { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 85%; max-width: 450px; z-index: 2000; border: 4px solid var(--frio); border-radius: 20px; transition: 0.3s; background: #000; image-rendering: high-quality; }
        
        /* FOOTER CON FONDOS TEMATIZADOS HD */
        .footer { 
            width: 100%; padding: 20px; display: none; gap: 15px; 
            background: #000; box-sizing: border-box; justify-content: center; 
            opacity: 0; transition: opacity 1s;
        }
        
        .btn-base { 
            flex: 1; height: 90px; border-radius: 15px; border: 2px solid; font-weight: bold; 
            cursor: pointer; text-transform: uppercase; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; text-decoration: none; background-size: cover; background-position: center;
            text-shadow: 2px 2px 4px #000;
        }

        /* BOTÓN FRÍO 16C */
        .btn-frio { 
            border-color: var(--frio); color: #fff;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('split16.jpg');
            box-shadow: 0 0 15px var(--frio);
            animation: palpitacionFrio 2s infinite;
        }

        /* BOTÓN CALOR 35C */
        .btn-calor { 
            border-color: var(--calor); color: #fff;
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('split35.jpg');
            box-shadow: 0 0 15px var(--calor);
            animation: espejismoCalor 1.5s infinite alternate;
        }

        @keyframes palpitacionFrio { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
        @keyframes espejismoCalor { 0% { transform: skewX(0deg); filter: blur(0px); } 100% { transform: skewX(1deg); filter: blur(0.5px); } }

        .btn-base:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <audio id="snd-cuarto" src="audio_vip.mp3" preload="auto"></audio>

    <div id="pantalla-play" class="layer active">
        <img src="logo.png" id="escudo-main" alt="Logo">
        <button id="btn-iniciar" onclick="arrancarTodo()">INICIAR PRESENTACIÓN</button>
    </div>

    <div id="fase-cuarto" class="layer">
        <img src="comparativa.jpg" id="img-cuarto">
    </div>

    <div id="fase-panel" class="layer">
        <h2 style="color:var(--frio); margin-top: 20px;">MULTISERVICIOS ANATO S.M.G.</h2>
        
        <div id="seccion-beneficios" class="panel-container">
            <div class="temp" style="color:var(--frio)">16°C ❄️</div>
            <h3 style="color: var(--frio); margin-bottom: 20px;">💎 BENEFICIOS V.I.P.</h3>
            <div id="lista-vip">
                <div class="item" data-img="chequeo.jpg">Tecnología y Vanguardia</div>
                <div class="item" data-img="emergencia.jpg">Atención 24/7</div>
                <div class="item" data-img="logistica.jpg">Logística y Transporte</div>
                <div class="item" data-img="mantenimiento.png">Mantenimiento Preventivo</div>
                <div class="item" data-img="candado.jpg">Tarifa VIP Protegida</div>
                <div class="item" data-img="informe.jpg">Informe Digital</div>
            </div>
        </div>

        <div id="seccion-riesgos" class="panel-container" style="display: none; opacity: 0;">
            <div class="temp" style="color:var(--riesgo)">38°C 🔥</div>
            <h3 style="color: var(--riesgo); margin-bottom: 15px;">⚠️ BAJO SU RESPONSABILIDAD</h3>
            <div id="lista-riesgo">
                <div class="item" data-img="fuga.jpg">Fugas de Gas</div>
                <div class="item" data-img="oxidado.jpg">Oxidación</div>
                <div class="item" data-img="quemado.jpg">Cortocircuitos</div>
                <div class="item" data-img="sucio.jpg">Suciedad</div>
            </div>
        </div>
        
        <div class="footer" id="bloque-cierre">
            <a href="bienvenidos.html" id="btn-aceptar" class="btn-base btn-frio">❄️ ACEPTAR V.I.P (16°C)</a>
            <button class="btn-base btn-calor" onclick="ejecutarRechazo()">♨️ OTRO MOMENTO (35°C)</button>
        </div>
    </div>

    <img id="pop-img" src="">

    <script>
        function arrancarTodo() {
            document.getElementById('btn-aceptar').onclick = function(e) {
                e.preventDefault();
                window.location.href = "bienvenidos.html" + window.location.search;
            };

            const audio = document.getElementById('snd-cuarto');
            document.getElementById('pantalla-play').classList.remove('active');
            document.getElementById('fase-cuarto').classList.add('active');
            audio.play();

            setTimeout(() => {
                document.getElementById('fase-cuarto').classList.remove('active');
                document.getElementById('fase-panel').classList.add('active');
                iniciarSecuenciaMaestra();
            }, 77000); 
        }

        async function iniciarSecuenciaMaestra() {
            // 1. Mostrar Beneficios VIP uno a uno
            const vipItems = document.querySelectorAll('#lista-vip .item');
            const pop = document.getElementById('pop-img');
            
            for(let it of vipItems) {
                pop.src = it.getAttribute('data-img');
                pop.style.transform = "translate(-50%, -50%) scale(1)";
                await new Promise(r => setTimeout(r, 1300));
                pop.style.transform = "translate(-50%, -50%) scale(0)";
                it.innerHTML = `<img src="${pop.src}"> ` + it.innerHTML + " ✅";
                it.classList.add('show');
                await new Promise(r => setTimeout(r, 400));
            }

            await new Promise(r => setTimeout(r, 3000)); // Espera tras ver beneficios

            // 2. Transición Suave de Beneficios a Riesgos
            const secBen = document.getElementById('seccion-beneficios');
            const secRie = document.getElementById('seccion-riesgos');
            
            secBen.style.opacity = "0";
            await new Promise(r => setTimeout(r, 800));
            secBen.style.display = "none";
            
            secRie.style.display = "block";
            setTimeout(() => { secRie.style.opacity = "1"; }, 50);

            // 3. Mostrar Riesgos uno a uno
            const rieItems = document.querySelectorAll('#lista-riesgo .item');
            for(let it of rieItems) {
                pop.src = it.getAttribute('data-img');
                pop.style.transform = "translate(-50%, -50%) scale(1.1)";
                await new Promise(r => setTimeout(r, 1500));
                pop.style.transform = "translate(-50%, -50%) scale(0)";
                it.innerHTML = `<img src="${pop.src}"> ` + it.innerHTML + " ❌";
                it.classList.add('show');
                await new Promise(r => setTimeout(r, 400));
            }

            // 4. Mostrar Bloque Final de Cierre
            const footer = document.getElementById('bloque-cierre');
            footer.style.display = "flex";
            setTimeout(() => { footer.style.opacity = "1"; }, 100);
        }

        function ejecutarRechazo() {
            new Audio('rechazo.mp3').play().catch(e => {});
            setTimeout(() => { window.location.href = "about:blank"; }, 3000);
            
           async function enviarADatos(decision, precio) {
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyl8kHQ3K1fGVM-mys1fu3GQEAMa2LOguLOa-OJx8Y8sYgLoURceNL4QwNx0fGvF1_b/exec";
    
    // Capturamos el nombre usando el ID "nombre"
    const nombreCliente = document.getElementById("nombre").value || "Cliente Sin Nombre";
    const ubicacion = "Valencia, Carabobo"; 

    const datos = {
        nombre: nombreCliente,
        decision: decision,
        precio: precio,
        ubicacion: ubicacion
    };

    try {
        fetch(URL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(datos)
        });
        
        if(decision === "Aceptó") {
            window.location.href = "bienvenido.html"; 
        } else {
            alert("Registro de rechazo completado. Gracias.");
        }
    } catch (error) {
        console.log("Error de conexión", error);
    }
}

// AQUÍ ESTÁ EL ARREGLO: Buscamos "btn" en lugar de "boton"
const btnFrio = document.querySelector('.btn-frio');
if(btnFrio) btnFrio.onclick = () => enviarADatos("Aceptó", "30$");

const btnCalor = document.querySelector('.btn-calor');
if(btnCalor) btnCalor.onclick = () => enviarADatos("Rechazó", "0$");
