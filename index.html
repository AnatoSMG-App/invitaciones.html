<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.G. - Panel de Control Murachi</title>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #111; padding: 30px; border-radius: 20px; border: 2px solid #00f2ff; box-shadow: 0 0 20px #00f2ff55; width: 90%; max-width: 400px; }
        h2 { color: #00f2ff; text-align: center; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: #00f2ff; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #link-box { margin-top: 20px; word-break: break-all; background: #000; padding: 10px; border-radius: 10px; font-size: 0.8rem; display: none; border: 1px dashed #555; }
    </style>
</head>
<body>
    <div class="box">
        <h2>PROYECTO MURACHI</h2>
        <input type="text" id="nombre" placeholder="Nombre del Cliente">
        <input type="text" id="ubicacion" placeholder="Sector / Ubicación">
        <input type="text" id="precio" placeholder="Precio (Ej: 40)">
        <input type="text" id="citas" placeholder="Fechas (Ej: 20 May, 20 Sep)">
        <button onclick="generarLink()">GENERAR ENLACE VIP</button>
        <div id="link-box"></div>
    </div>

    <script>
        function generarLink() {
            const n = encodeURIComponent(document.getElementById('nombre').value);
            const u = encodeURIComponent(document.getElementById('ubicacion').value);
            const p = encodeURIComponent(document.getElementById('precio').value);
            const c = encodeURIComponent(document.getElementById('citas').value);
            
            if(!n || !p) { alert("Amo, complete los datos básicos"); return; }

            // IMPORTANTE: Cambie 'tuweb.com' por su dirección real
            const urlBase = "https://tuweb.com/presentacion.html";
            const finalLink = `${urlBase}?n=${n}&u=${u}&p=${p}&c=${c}`;
            
            const wa = `https://wa.me/?text=${encodeURIComponent("💎 ¡Bienvenido a la Experiencia VIP de S.M.G.! Toque el enlace para ver su presupuesto anclado: " + finalLink)}`;
            
            const box = document.getElementById('link-box');
            box.style.display = "block";
            box.innerHTML = `<a href="${wa}" style="color:#00f2ff; text-decoration:none;">🚀 ENVIAR POR WHATSAPP</a>`;
            window.open(wa, '_blank');
        }
    </script>
</body>
</html>
