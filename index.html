<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Murachi - Invitación</title>
    <style>
        body { font-family: sans-serif; background-color: #000; color: #fff; margin: 0; padding: 20px; }
        .contenedor-beneficio {
            display: flex; 
            align-items: center; 
            margin-bottom: 25px; 
            border: 2px solid #444; 
            padding: 15px; 
            border-radius: 12px;
            background: #111;
        }
        .img-beneficio {
            width: 120px; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-right: 20px;
        }
        .texto-titulo {
            font-size: 1.8rem; /* Letras bien grandes para el móvil */
            color: #2ecc71;
            display: block;
            margin-bottom: 5px;
        }
        .texto-desc {
            font-size: 1.3rem; 
            color: #bdc3c7;
        }
        button {
            padding: 20px;
            font-size: 1.5rem;
            width: 100%;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="contenido-principal">
        <h1 style="text-align: center;">Bienvenido al Proyecto Murachi</h1>
        
        <div id="beneficios-container"></div>

        <button onclick="ejecutarRechazo()">FINALIZAR</button>
    </div>

    <script>
        // Datos de ejemplo (Esto simula lo que ya tienes en tu lógica)
        const beneficios = [
            { titulo: "Tecnología Vanguardia", img: "tecnologia.jpg" },
            { titulo: "Detección de Fugas", img: "fuga.jpg" }
        ];

        const it = document.getElementById('beneficios-container');

        // FUNCIÓN CORREGIDA: Sin duplicados y con diseño fuerte
        function cargarBeneficios() {
            let htmlFinal = ""; // Limpiamos antes de empezar
            beneficios.forEach(b => {
                htmlFinal += `
                    <div class="contenedor-beneficio">
                        <img src="${b.img}" class="img-beneficio">
                        <div>
                            <strong class="texto-titulo">${b.titulo}</strong>
                            <span class="texto-desc">Optimización Murachi activa.</span>
                        </div>
                    </div>
                `;
            });
            it.innerHTML = htmlFinal; // Reemplaza todo, no duplica
        }

        // FUNCIÓN DE CIERRE: Limpia la pantalla totalmente
        function ejecutarRechazo() {
            alert("Gracias por su tiempo, invitación finalizada.");
            document.body.innerHTML = `
                <div style="display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; text-align:center; background:#000; color:#fff; padding:20px;">
                    <h2 style="color:#f1c40f; font-size:2.5rem;">¡LISTO!</h2>
                    <p style="font-size:1.8rem;">Invitación gestionada correctamente.</p>
                    <p style="color:#7f8c8d; font-size:1.2rem;">Ya puedes cerrar esta ventana.</p>
                </div>
            `;
        }

        // Iniciar carga
        cargarBeneficios();
    </script>
</body>
</html>
