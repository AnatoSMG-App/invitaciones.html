<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anato S.M.G. VIP</title>
    <style>
        :root { --vip: #00f2ff; --riesgo: #ff3131; }
        body, html { margin: 0; padding: 0; background: #000; font-family: sans-serif; overflow-x: hidden; color: white; height: 100%; width: 100%; }
        
        .layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; justify-content: center; align-items: center; flex-direction: column; text-align: center; background: #000; }
        .active { display: flex; }

        /* PANTALLA INICIAL - LOGO CENTRADO */
        #pantalla-play { z-index: 5000; }
        #escudo-main { 
            width: 85%; 
            max-width: 500px; 
            margin-bottom: 30px; 
            animation: latido 2s infinite; 
            filter: drop-shadow(0 0 15px var(--vip));
        }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        #btn-iniciar { 
            background: var(--vip); color: #000; padding: 18px 40px; 
            border-radius: 50px; border: none; font-weight: bold; font-size: 1.2rem; 
            cursor: pointer; box-shadow: 0 0 20px var(--vip);
            text-transform: uppercase;
        }

        /* CONTROL DE IMÁGENES DE PRESENTACIÓN */
        .layer > img {
            max-width: 85% !important;   
            max-height: 50vh !important; 
            object-fit: contain !important;
            margin: 20px auto;
        }

        /* FASE: COMPARATIVA */
        #fase-cuarto { z-index: 1000; }
        #img-cuarto { width: 90%; height: auto; border: 2px solid var(--vip); border-radius: 10px; }

        /* FASE: PANEL FINAL */
        #fase-panel { z-index: 500; overflow-y: auto; display: none; padding-top: 20px; }
        #fase-panel.active { display: block; }
        
        .split { display: flex; flex-wrap: wrap; width: 100%; min-height: 60vh; }
        .panel { flex: 1; min-width: 300px; padding: 15px; border: 1px solid #222; }
        .temp { font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; }
        
        .item { display: flex; align-items: center; margin-bottom: 15px; opacity: 0; transform: scale(0.8); transition: 0.5s; font-size: 0.9rem; text-align: left; }
        .item.show { opacity: 1; transform: scale(1); }
        .item img { width: 35px; height: 35px; border-radius: 5px; margin-right: 10px; border: 1px solid var(--vip); }

        #pop-img { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 80%; max-width: 400px; z-index: 2000; border: 4px solid var(--vip); border-radius: 20px; transition: 0.3s; background: #000; }
        
        .footer { width: 100%; padding: 20px; display: flex; gap: 10px; background: #000; position: relative; }
        .btn-v { flex: 1; padding: 20px; background: #39ff14; color: #000; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-r { flex: 1; padding: 20px; background: #ff3131; color: #fff; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }

        @keyframes titilar { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="snd-cuarto" src="audio_vip.mp3" preload="auto"></audio>
    <audio id="snd-ok" src="aceptacion.mp3" preload="auto"></audio>

    <div id="pantalla-play" class="layer active">
        <img src="logo.png" id="escudo-main" alt="Logo">
        <button id="btn-iniciar" onclick="arrancarTodo()">INICIAR PRESENTACIÓN</button>
    </div>

    <div id="fase-cuarto" class="layer">
        <img src="comparativa.jpg" id="img-cuarto">
    </div>

    <div id="fase-panel" class="layer">
        <h2 style="color:var(--vip); margin: 20px 0;">MULTISERVICIOS ANATO S.M.G.</h2>
        <div class="split">
            <div class="panel">
                <div class="temp" style="color:var(--vip)">16°C ❄️</div>
                <h3 style="color: var(--vip); margin-bottom: 20px;">💎 BENEFICIOS V.I.P.</h3>
                <div id="lista-vip">
                    <div class="item" data-img="chequeo.jpg">Tecnología y Vanguardia</div>
                    <div class="item" data-img="emergencia.jpg">Atención 24/7</div>
                    <div class="item" data-img="logistica.jpg">Logística y Transporte</div>
                    <div class="item" data-img="mantenimiento.png">Mantenimiento Preventivo</div>
                    <div class="item" data-img="candado.jpg">Presupuesto Anclado</div>
                    <div class="item" data-img="informe.jpg">Informe Digital</div>
                </div>
            </div>
            <div class="panel">
                <div class="temp" style="color:var(--riesgo)">38°C 🔥</div>
                <div style="color: #ff9100; font-size: 0.8rem; font-weight: bold; animation: titilar 0.8s infinite; margin-bottom: 15px; border: 1px dashed #ff9100; padding: 5px;">
                    ⚠️ BAJO SU PROPIA RESPONSABILIDAD ⚠️
                </div>
                <div id="lista-riesgo">
                    <div class="item" data-img="fuga.jpg">Fugas de Gas</div>
                    <div class="item" data-img="oxidado.jpg">Oxidación</div>
                    <div class="item" data-img="quemado.jpg">Cortocircuitos</div>
                    <div class="item" data-img="sucio.jpg">Suciedad</div>
                </div>
            </div>
        </div>
        <div class="footer">
            <button class="btn-v" onclick="window.location.href='bienvenidos.html'">ACEPTO SER V.I.P</button>
            <button class="btn-r" onclick="ejecutarRechazo()">EN OTRO MOMENTO</button>
        </div>
    </div>

    <img id="pop-img" src="">

    <script>
        function arrancarTodo() {
            const audio = document.getElementById('snd-cuarto');
            
            // Bypass de audio: Avanza aunque el audio falle
            audio.play().catch(e => console.log("Audio omitido para evitar bloqueo"));

            document.getElementById('pantalla-play').classList.remove('active');
            document.getElementById('fase-cuarto').classList.add('active');

            // Tiempo de espera para pasar al panel (7.7 segundos para prueba rápida, ajusta si prefieres los 77)
            setTimeout(() => {
                document.getElementById('fase-cuarto').classList.remove('active');
                document.getElementById('fase-panel').classList.add('active');
                ejecutarDanza();
            }, 77000); 
        }

        async function ejecutarDanza() {
            const pop = document.getElementById('pop-img');
            const items = document.querySelectorAll('.item');
            for(let it of items) {
                let imgPath = it.getAttribute('data-img');
                if(imgPath) {
                    pop.src = imgPath;
                    pop.style.transform = "translate(-50%, -50%) scale(1)";
                    await new Promise(r => setTimeout(r, 1200));
                    pop.style.transform = "translate(-50%, -50%) scale(0)";
                    it.innerHTML = `<img src="${imgPath}"> ` + it.innerHTML + " ✅";
                }
                it.classList.add('show');
                await new Promise(r => setTimeout(r, 400));
            }
        }

        function ejecutarRechazo() {
            // Se usa el nombre en minúscula para coincidir con GitHub
            var audioR = new Audio('rechazo.mp3'); 
            audioR.play().catch(e => console.log("Sonido de rechazo no encontrado"));
            setTimeout(function(){ 
                alert("Gracias por su tiempo. Invitación finalizada.");
               window.close();
            }, 3000);
        }
    </script>
</body>
</html>
