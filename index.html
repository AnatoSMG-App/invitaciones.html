<script>
        // 1. CAPTURA DE DATOS (El puente maestro de Multiservicio Anato)
        const urlParams = new URLSearchParams(window.location.search);
        const nCli = urlParams.get('n') || "Cliente";
        const uCli = urlParams.get('u') || "Valencia";
        const pCli = urlParams.get('p') || "0";

        function arrancarTodo() {
            // Configuramos el botón de aceptar para que lleve los datos a la bienvenida
            document.getElementById('btn-aceptar').onclick = function(e) {
                e.preventDefault();
                enviarYRedirigir('Aceptó');
            };

            const audio = document.getElementById('snd-cuarto');
            document.getElementById('pantalla-play').classList.remove('active');
            document.getElementById('fase-cuarto').classList.add('active');

            // Reproduce tu audio VIP (asegúrate que el archivo se llame audio_vip.mp3)
            audio.play().catch(e => console.log("Audio esperando interacción"));

            // RELOJ MAESTRO: 77 SEGUNDOS
            setTimeout(() => {
                document.getElementById('fase-cuarto').classList.remove('active');
                document.getElementById('fase-panel').classList.add('active');
                ejecutarDanza();
            }, 77000); 
        }

        async function ejecutarDanza() {
            const pop = document.getElementById('pop-img');
            const items = document.querySelectorAll('.item');
            for(let it of items) {
                let imgPath = it.getAttribute('data-img');
                if(imgPath) {
                    pop.src = imgPath;
                    pop.style.transform = "translate(-50%, -50%) scale(1)";
                    await new Promise(r => setTimeout(r, 1200));
                    pop.style.transform = "translate(-50%, -50%) scale(0)";
                    it.innerHTML = `<img src="${imgPath}"> ` + it.innerHTML + " ✅";
                }
                it.classList.add('show');
                await new Promise(r => setTimeout(r, 400));
            }
        }

        // FUNCIÓN DE ENVÍO AL EXCEL (La que nos costó cuadrar)
        async function enviarYRedirigir(decision) {
            const urlScript = "https://script.google.com/macros/s/AKfycbyl8kHQ3K1fGVM-mys1fu3GQEAMa2LOguLOa-OJx8Y8sYgLoURceNL4QwNx0fGvF1_b/exec";
            const datos = new URLSearchParams();
            datos.append('nombre', nCli);
            datos.append('decision', (decision === 'Aceptó' ? "SI VIP" : "NO VIP"));
            datos.append('precio', pCli + "$");
            datos.append('ubicacion', uCli);

            // Envío en segundo plano
            fetch(urlScript, { method: "POST", mode: "no-cors", body: datos.toString() });

            if (decision === 'Aceptó') {
                // Pasa a bienvenidos.html llevando el nombre y datos en el link
                window.location.href = "bienvenidos.html" + window.location.search;
            } else {
                alert("Gracias por su tiempo, " + nCli);
                window.location.href = "about:blank";
            }
        }

        function ejecutarRechazo() {
            new Audio('rechazo.mp3').play().catch(e => {});
            setTimeout(function(){ 
                enviarYRedirigir('Rechazó');
            }, 2000);
        }
    </script>
