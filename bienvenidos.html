<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida VIP - S.M.G.</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
        .container { padding: 30px; border: 5px solid #00ff00; border-radius: 30px; background: rgba(0, 255, 0, 0.05); box-shadow: 0 0 30px #00ff0066; z-index: 10; width: 85%; max-width: 600px; }
        .logo { max-width: 350px; height: auto; margin: 15px auto; display: block; }
        h1 { color: #00ff00; font-size: 28px; text-transform: uppercase; margin-bottom: 10px; }
        p { font-size: 20px; line-height: 1.4; margin: 10px 0; }
        .precio-anclado { color: #ffff00; font-size: 26px; font-weight: bold; text-shadow: 0 0 10px rgba(255,255,0,0.5); }
        
        /* EL AVISO DE CAPTURA QUE ME PEDISTE */
        .alerta-capture { 
            background: #ffcc00; 
            color: #000; 
            padding: 15px; 
            font-weight: bold; 
            border-radius: 15px; 
            margin-top: 20px; 
            font-size: 16px; 
            border: 3px dashed #000;
            animation: parpadeo 1s infinite;
        }

        @keyframes parpadeo {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        .btn-salir { margin-top: 20px; padding: 12px 40px; font-size: 20px; font-weight: bold; color: #fff; background-color: #ff4d4d; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <audio id="aplausos">
        <source src="aceptacion.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1>¡BIENVENIDO AL GRUPO VIP!</h1>
        
        <img src="logo.png" alt="S.M.G." class="logo">
        
        <p>Tu Próximo Mantenimiento <strong>QUEDÓ ANCLADO</strong> a:</p>
        <p class="precio-anclado" id="precio-final">($)</p>
        <p>Por este año 2026.</p>
        
        <p>Tomaste la <strong>MEJOR DECISIÓN</strong>.</p>
        <script>
  // Este es el cable que conecta el link con la línea 48
  const urlParams = new URLSearchParams(window.location.search);
  const precioDolares = urlParams.get('p');

  if (precioDolares) {
    // Aquí es donde sucede la magia en la línea 48
    document.getElementById('precio-final').innerText = precioDolares + " USD";
  }
</script>
        <div class="alerta-capture">
            📸 POR FAVOR, TOME CAPTURA DE PANTALLA PARA QUE NO PIERDA SUS FECHAS DE MANTENIMIENTO NI SU PRECIO ANCLADO.
        </div>

        <button onclick="location.href='index.html'" class="btn-salir">FINALIZAR</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        window.onload = function() {
            // 1. LEER PRECIO DEL GENERADOR
            const urlParams = new URLSearchParams(window.location.search);
            const precioUrl = urlParams.get('p');
            if(precioUrl) {
                document.getElementById('precio-final').innerText = `(${precioUrl}$)`;
            }

            // 2. ARRANCAR AUDIO
            var sonido = document.getElementById('aplausos');
            if (sonido) {
                sonido.play().catch(e => console.log("Audio esperando clic"));
            }

            // 3. EFECTO NIEVE (7 segundos)
            var endNieve = Date.now() + (7 * 1000);
            (function frame() {
                confetti({
                    particleCount: 2,
                    startVelocity: 0,
                    ticks: 200,
                    origin: { x: Math.random(), y: Math.random() - 0.2 },
                    colors: ['#ffffff', '#e0f7fa'],
                    shapes: ['star'],
                    gravity: 0.5,
                    scalar: 0.8,
                    drift: 0.5
                });
                if (Date.now() < endNieve) { requestAnimationFrame(frame); }
            }());

            // 4. ELIMINAMOS EL CIERRE AUTOMÁTICO PARA QUE EL CLIENTE TENGA TIEMPO DE TOMAR LA CAPTURA
        };
    </script>
</body>
</html>
