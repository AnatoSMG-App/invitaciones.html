<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bienvenida VIP - S.M.G.</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; overflow: hidden; }
        .container { padding: 30px; border: 5px solid #00ff00; border-radius: 30px; background: rgba(0, 255, 0, 0.05); box-shadow: 0 0 30px #00ff0066; z-index: 10; width: 85%; max-width: 600px; }
        .logo { max-width: 320px; height: auto; margin: 15px auto; display: block; filter: drop-shadow(0 0 10px #00ff00); }
        h1 { color: #00ff00; font-size: 24px; text-transform: uppercase; margin-bottom: 5px; }
        .cliente-vip { color: #00f2ff; font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        p { font-size: 18px; line-height: 1.4; margin: 8px 0; }
        .precio-anclado { color: #ffff00; font-size: 32px; font-weight: bold; text-shadow: 0 0 15px rgba(255,255,0,0.6); }
        
        .alerta-capture { 
            background: #ffcc00; 
            color: #000; 
            padding: 12px; 
            font-weight: bold; 
            border-radius: 15px; 
            margin-top: 15px; 
            font-size: 14px; 
            border: 3px dashed #000;
            animation: parpadeo 1s infinite;
        }

        @keyframes parpadeo {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }

        .btn-salir { margin-top: 20px; padding: 15px 50px; font-size: 20px; font-weight: bold; color: #fff; background-color: #39ff14; color: #000; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 0 15px #39ff14; transition: 0.3s; }
        .btn-salir:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <audio id="aplausos" src="aceptacion.mp3" preload="auto"></audio>
    <audio id="cash-register" src="caja.mp3" preload="auto"></audio>

    <div class="container">
        <h1>¡SISTEMA VIP ACTIVADO!</h1>
        <div id="nombre-cliente" class="cliente-vip">Cargando...</div>
        
        <img src="logo.png" alt="S.M.G." class="logo">
        
        <p>Su Próximo Mantenimiento en <br><span id="ubicacion" style="color:#00f2ff">...</span></p>
        <p><strong>HA QUEDADO ANCLADO</strong> en:</p>
        <p class="precio-anclado" id="precio-final">$00</p>
        <p>Por este año 2026.</p>
        
        <div class="alerta-capture">
            📸 POR FAVOR, TOME CAPTURA DE PANTALLA PARA RESPALDAR SU PRECIO Y SU FECHA DE MANTENIMIENTO.
        </div>

        <button onclick="finalizarProceso()" class="btn-salir">FINALIZAR</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            // 1. MAPEAR DATOS DEL GENERADOR
            const nombre = urlParams.get('n') || "CLIENTE EXCLUSIVO";
            const precio = urlParams.get('p') || "30";
            const ubicacion = urlParams.get('u') || "SU SECTOR";

            document.getElementById('nombre-cliente').innerText = `BIENVENIDO: ${nombre.toUpperCase()}`;
            document.getElementById('precio-final').innerText = `$${precio}`;
            document.getElementById('ubicacion').innerText = ubicacion.toUpperCase();

}
            // 2. SONIDO INICIAL (OPCIONAL SEGÚN NAVEGADOR)
            var sonido = document.getElementById('aplausos');
            sonido.play().catch(e => console.log("Esperando interacción"));

            // 3. EFECTO NIEVE VIP (7 segundos)
            var endNieve = Date.now() + (7 * 1000);
            (function frame() {
                confetti({
                    particleCount: 2,
                    startVelocity: 0,
                    ticks: 200,
                    origin: { x: Math.random(), y: Math.random() - 0.2 },
                    colors: ['#ffffff', '#00f2ff', '#ffff00'],
                    shapes: ['star'],
                    gravity: 0.5,
                    scalar: 0.8,
                    drift: 0.5
                });
                if (Date.now() < endNieve) { requestAnimationFrame(frame); }
            }());
        };

        // FUNCIÓN DEL BOTÓN ROJO CLONADA AL ÉXITO
        function finalizarProceso() {
            const cash = document.getElementById('cash-register');
            cash.play(); // SONIDO DE CAJA REGISTRADORA 💰
            
            setTimeout(function(){ 
                window.close();
                // Backup por si el navegador bloquea el cierre directo
                setTimeout(() => { window.location.href = "https://www.google.com"; }, 500);
            }, 2500);
        }
    </script>
</body>
</html>
