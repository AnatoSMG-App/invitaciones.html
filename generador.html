<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.M.G. - Generador de Enlaces</title>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #111; padding: 25px; border-radius: 20px; border: 2px solid #00f2ff; box-shadow: 0 0 20px #00f2ff55; width: 90%; max-width: 420px; }
        h2 { color: #00f2ff; text-align: center; font-size: 1.1rem; text-transform: uppercase; }
        .label { font-size: 0.7rem; color: #00f2ff; margin-bottom: 5px; display: block; }
        select, input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; }
        .ops { display: flex; gap: 5px; margin-bottom: 15px; }
        .op-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; opacity: 0.4; font-size: 0.65rem; transition: 0.3s; }
        .op-btn.active { opacity: 1; transform: scale(1.05); border: 1px solid #fff; }
        .digitel { background: #0055ff; color: #fff; }
        .movistar { background: #00ff00; color: #000; }
        .movilnet { background: #ff6600; color: #fff; }
        .btn-gen { width: 100%; padding: 18px; border-radius: 12px; border: none; background: #00f2ff; color: #000; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🚀 GENERADOR S.M.G. ELITE</h2>
        
        <span class="label">País:</span>
        <select id="cod-pais">
            <option value="58">🇻🇪 Venezuela (+58)</option>
            <option value="1">🇺🇸 USA (+1)</option>
            <option value="51">🇵🇪 Perú (+51)</option>
            <option value="57">🇨🇴 Colombia (+57)</option>
        </select>

        <span class="label">Operadora (Venezuela):</span>
        <div class="ops">
            <button class="op-btn digitel" onclick="setOp('0412', this)">0412</button>
            <button class="op-btn movistar" onclick="setOp('0414/0424', this)">0414/24</button>
            <button class="op-btn movilnet" onclick="setOp('0416/0426', this)">0416/26</button>
        </div>

        <input type="text" id="nombre" placeholder="Nombre del Cliente">
        <input type="text" id="ubicacion" placeholder="Ubicación">
        <input type="text" id="precio" placeholder="Monto (USD)">
        <input type="text" id="citas" placeholder="Fechas de Mantenimiento">
        
        <button class="btn-gen" onclick="generarLink()">🚀 ENVIAR PRESENTACIÓN</button>
    </div>

    <script>
        let operadoraSel = "N/A";
        function setOp(op, btn) {
            operadoraSel = op;
            document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function generarLink() {
            const pais = document.getElementById('cod-pais').value;
            const n = encodeURIComponent(document.getElementById('nombre').value);
            const u = encodeURIComponent(document.getElementById('ubicacion').value);
            const p = encodeURIComponent(document.getElementById('precio').value);
            const c = encodeURIComponent(document.getElementById('citas').value);
            
            if(!n || !p) { alert("Amo, complete los datos."); return; }

            // CORRECCIÓN CLAVE: El link ahora apunta a presentacion.html
            // Asegúrese de que el archivo se llame exactamente presentacion.html en su servidor
            const urlBase = window.location.href.replace('generador.html', 'presentacion.html');
            const finalLink = `${urlBase}?n=${n}&u=${u}&p=${p}&c=${c}&op=${operadoraSel}&pref=${pais}`;
            
            const mensaje = `💎 *S.M.G. VIP* 💎\n\nHola, hemos procesado tu presupuesto Elite. Mira los detalles aquí:\n${finalLink}`;
            const wa = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
            
            window.open(wa, '_blank');
        }
    </script>
</body>
</html>
